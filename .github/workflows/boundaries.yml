name: Backend import boundary

# T01 warning mode: reports new frontend -> backend imports without blocking merges.
# T16 flips this to blocking by removing `continue-on-error` and the baseline.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check imports
        run: node scripts/check-backend-imports.mjs
